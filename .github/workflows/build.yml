name: Build

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  packages: write

# Resolve the draft release tag created by semantic-release, then fan out to
# all build jobs. If the Release workflow finished without creating a release
# (e.g. no releasable commits) there will be no draft and every job exits
# early via the `if` guard on the `resolve` output.
jobs:
  resolve:
    name: Resolve draft release tag
    runs-on: ubuntu-latest
    # Only proceed when the Release workflow actually succeeded.
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find latest draft release tag
        id: find
        run: |
          TAG=$(gh release list \
                  --repo "${{ github.repository }}" \
                  --limit 10 \
                  --json tagName,isDraft \
                  --jq '[.[] | select(.isDraft)] | first | .tagName // ""')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "No draft release found — semantic-release made no new version. Skipping build."
          else
            echo "Building for draft release: $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz

          # Linux musl (static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz

          # macOS — native builds on the matching runner arch
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install native deps (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libssl-dev libssh2-1-dev pkg-config

      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3 libssh2 cmake

      - name: Install native deps (Windows)
        if: runner.os == 'Windows'
        run: |
          $triplet = if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") { "arm64-windows-static-md" } else { "x64-windows-static-md" }
          vcpkg install "openssl:$triplet"
          vcpkg integrate install
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_DIR=C:\vcpkg\installed\$triplet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSSH2_NO_VCPKG=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_NO_LIBSSH2=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }} --features git2/vendored-openssl

      - name: Build (cargo — macOS)
        if: "!matrix.use_cross && runner.os == 'macOS'"
        run: cargo build --release --locked --target ${{ matrix.target }} --features git2/vendored-openssl

      - name: Build (cargo — non-macOS)
        if: "!matrix.use_cross && runner.os != 'macOS'"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Determine binary name
        id: bin
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "name=skot.exe" >> "$GITHUB_OUTPUT"
          else
            echo "name=skot" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="skot-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${{ steps.bin.outputs.name }}" skot
          tar czf "$ARCHIVE" skot
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ARCHIVE = "skot-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}.zip"
          Copy-Item "target\${{ matrix.target }}\release\skot.exe" -Destination .
          Compress-Archive -Path skot.exe -DestinationPath $ARCHIVE
          "ARCHIVE=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: ${{ env.ARCHIVE }}

  package-deb:
    name: Debian package
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libssl-dev libssh2-1-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: deb

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .deb
        run: cargo deb --no-build

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: target/debian/*.deb

  appimage:
    name: AppImage
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libssl-dev libssh2-1-dev pkg-config \
            fuse libfuse2

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: appimage

      - name: Build release binary
        run: cargo build --release --locked

      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/skot AppDir/usr/bin/skot
          cp assets/skot.png AppDir/skot.png

          cat > AppDir/skot.desktop <<'EOF'
          [Desktop Entry]
          Name=skot
          Exec=skot
          Icon=skot
          Type=Application
          Categories=Development;
          Comment=Manage a patch series against an upstream git repository
          Terminal=true
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/bin/skot" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir "skot-${{ needs.resolve.outputs.tag }}-x86_64.AppImage"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: "skot-${{ needs.resolve.outputs.tag }}-x86_64.AppImage"

  docker:
    name: Docker image
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          echo "full=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [resolve, build, package-deb, appimage, docker]
    if: needs.resolve.outputs.tag != ''
    steps:
      - name: Publish draft release
        run: gh release edit "${{ needs.resolve.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
