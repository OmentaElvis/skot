[package]
name = "skot"
version = "1.1.0"
edition = "2024"
description = "Manage a patch series against an upstream git repository and build easily produce build outputs."
license = "MIT"
repository = "https://github.com/OmentaElvis/skot"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "skot"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
# config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# errors
anyhow = "1"
thiserror = "2"
# terminal
indicatif = "0.18"
inquire = "0.9"
console = "0.16"
# Diagnostics. Every record goes to stderr and is filtered by RUST_LOG; the default is quiet
# enough that a normal run prints only what the user asked to be told.
#
# stdout is reserved for parsable output -- currently the `--json` document and nothing else --
# so a script can pipe skot anywhere without its diagnostics corrupting the result. This is
# the same split every well-behaved Unix tool makes, and it means `RUST_LOG=debug` is the way
# to find out what skot was doing rather than re-reading the source.
log = "0.4"
env_logger = "0.11"
# Suspends the progress display around every log write. Without it a record emitted while a
# bar is ticking gets erased by that bar's next redraw, which is the one thing a progress bar
# must never do to a line it did not draw.
indicatif-log-bridge = "0.2"
# The git engine. `git2` wraps libgit2, so skot needs no `git` binary installed --
# but it does build libgit2 from C source. That is the accepted trade: libgit2 has the
# patch-application, worktree, checkout and diff APIs skot needs, so skot implements
# none of them itself.
#
# `https` and `ssh` are not optional extras. Without them libgit2 builds with no transport
# capable of TLS or SSH at all, and every remote fails with "there is no TLS stream
# available" -- including the https://github.com/... remotes that are the entire point of
# mirroring an upstream. Both features link against the system OpenSSL, so building skot
# needs OpenSSL's headers (`libssl-dev` on Debian and Ubuntu, `openssl-devel` on Fedora) and
# libssh2. `vendored-openssl` is available in git2 if that is not acceptable.
git2 = { version = "0.21", features = ["https", "ssh"] }
# The sandbox lock: flock(2) on unix, LockFileEx on Windows, issued directly rather than
# through std's File::try_lock, which is not implemented on every target.
fs4 = { version = "1", features = ["sync"] }
# Reading a remote URL the way git reads it: scheme URLs, scp-like `host:path`, local
# paths, remote helpers. `import --pr` needs the host of whatever the user gave, and
# git's grammar has edge cases (ports, brackets, `user@` or not) that are not worth
# reimplementing wrongly once -- gix-url is the gitoxide parser for exactly this, and
# a location it rejects simply reads as having no host rather than failing a command.
gix-url = "0.40.0"
# Content addressing for the blob store: a patch names a binary file by the sha256 of
# its bytes, so the name doubles as the integrity check on read and two patches holding
# the same bytes share one file. Hashing bytes is all of it, so this stays a one-purpose
# crate rather than a general crypto stack.
sha2 = "0.10"
dirs = "6"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

[package.metadata.deb]
maintainer = "Elvis Omenta"
copyright = "2026, Elvis Omenta"
license-file = ["LICENSE", "4"]
extended-description = """\
Manage a patch series against an upstream git repository \
and easily produce build outputs."""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
  ["target/release/skot", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/skot/README", "644"],
]
